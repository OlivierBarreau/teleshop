spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/users/**
        - id: order-service
          uri: http://order-service:8080
          predicates:
            - Path=/orders/**
        - id: inventory-service
          uri: http://inventory-service:8080
          predicates:
            - Path=/inventory/**
        - id: notification-service
          uri: http://notification-service:8080
          predicates:
            - Path=/notifications/**
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
