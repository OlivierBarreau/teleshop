version: '3.9'
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  user-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  order-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  inventory-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventorydb"]
      interval: 5s
      timeout: 5s
      retries: 20

  notification-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notificationdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  payment-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d paymentdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  user-service:
    build: ./user-service
    depends_on:
      user-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  order-service:
    build: ./order-service
    depends_on:
      order-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  inventory-service:
    build: ./inventory-service
    depends_on:
      inventory-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  notification-service:
    build: ./notification-service
    depends_on:
      notification-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  payment-service:
    build: ./payment-service
    depends_on:
      payment-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - order-service
      - inventory-service
      - notification-service
      - payment-service
